name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build binary
        working-directory: vks_bootstraper
        run: pyinstaller --clean --noconfirm vks-bootstraper.spec

      - name: Smoke test
        run: |
          bin=vks_bootstraper/dist/vks-bootstraper
          file "$bin"
          "$bin" --help
          mkdir -p out
          cp "$bin" "out/vks-bootstraper-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vks-bootstraper-linux-${{ matrix.arch }}
          path: out/vks-bootstraper-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          chmod +x vks-bootstraper-linux-*
          sha256sum vks-bootstraper-linux-* > sha256sums.txt
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" vks-bootstraper-linux-* sha256sums.txt --clobber
